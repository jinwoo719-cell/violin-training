# 스트림릿 기본 테마 — theme.py 의 Warm Violin 팔레트와 같은 값입니다.
# 여기를 안 맞추면 슬라이더·체크박스처럼 **스트림릿이 직접 그리는 것**만
# 옛 색(보라)으로 남습니다.
[theme]
base = "dark"
primaryColor = "#d6a85f"            # C["accent"] — 골드
backgroundColor = "#0d1117"         # C["bg"]
secondaryBackgroundColor = "#171e27"  # C["panel"]
textColor = "#f2f0ea"               # C["ink"]
font = "sans serif"

[server]
runOnSave = true
